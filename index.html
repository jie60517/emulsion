<!doctype html>
<html lang="en" data-astryx-theme="gothic" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!--
      Astryx never ships font files: its themes only name a family and expect the
      app to load it. These are the nine families the seven themes ask for, under
      exactly the names the themes use — so no token needs overriding.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Figtree:wght@400;500;600;700&family=Fraunces:wght@400;500;600;700&family=Fustat:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Playwrite+US+Trad&family=Poppins:wght@400;500;600;700&display=swap"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emulsion — Cinestill 800T halation</title>
    <meta
      name="description"
      content="Add Cinestill 800T halation, film grain and cinematic grades to photos and video, in the browser."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
